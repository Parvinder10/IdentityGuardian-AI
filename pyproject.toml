[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veridoc_vlm"
version = "0.1.0"
description = "A Calibration-Aware Self-Healing Document Layout Parsing, Forgery Verification, and Multilingual RAG system"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pytorch-lightning>=2.1.0",
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "peft>=0.8.0",
    "trl>=0.7.11",
    "bitsandbytes>=0.42.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0",
    "opencv-python>=4.9.0.80",
    "pillow>=10.2.0",
    "scikit-learn>=1.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.3",
    "seaborn>=0.13.2",
    "rank_bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "pytest>=8.0.0",
    "networkx>=3.2.1",
    "sympy>=1.12",
    "requests>=2.31.0",
    "pydantic>=2.6.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
